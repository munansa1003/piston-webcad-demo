# GitHub Pages 배포: 기본 브랜치에 push 되면 typecheck → test → build → Pages 로 배포
# 프로젝트 페이지라 base 경로가 /piston-webcad-demo/ (Vercel 등 루트 배포는 base 없이 npm run build)
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/piston-parametric-webcad-demo-iok4q7"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build --base=/piston-webcad-demo/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
